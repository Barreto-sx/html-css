<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <style>
        div{
            margin: 8px;
        }
    </style>
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <div>
            <label for="inome">Nome: </label>
            <input type="text" name="noem" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="name">
        </div>
        <div>
            <label for="imedia">Media:</label>
            <input type="number" name="media" id="imedia" max="10" min="0" placeholder="0 a 10" step="0.1" value="6">
        </div>
        <div>
            <label for="imes">periodo do ano</label>
            <input type="month" name="mes" id="imes" value="2020-07">
        </div>
        <div>
            <label for="iprova">Dia da prova: </label>
            <input type="date" name="prova" id="iprova">
        </div>
        <div><label for="ihora">horario da prova: </label>
            <input type="time" name="hora" id="ihora">
        </div>
        <div>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </div>
    </form>
</body>
</html>
