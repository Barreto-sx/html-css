<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form action="cadastro.php" method="POST" autocomplete="on">
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required minlength="8" maxlength="22" size="20" placeholder="Nome do usuario" autocomplete="username">
        </p>
        <p>
            <label for="isenha">senha: </label>
            <input type="password" name="senha:" id="isenha" required minlength="8" maxlength="22" placeholder="Senha do usuario" autocomplete="new-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
