<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexom" value="Feminino"><label for="isexom">Masculino</label><br>
            <input type="radio" name="sexo" id="isexof" value="Masculino"><label for="isexof">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" checked>
            <label for="iesfut"> futebol</label> <br>
            <input type="checkbox" name="esbas" id="iesbas">
            <label for="iesbas"> basquete</label> <br>
            <input type="checkbox" name="esnat" id="iesnat"> 
            <label for="iesnat">nataçao</label> <br>
            <input type="checkbox" name="esvol" id="iesvol" checked>
            <label for="iesvol">voleibol</label> <br>
        </fieldset>

      <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
      </p>
    </form>
</body>
</html>
